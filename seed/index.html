<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barn Coffee</title>
<style>
  :root { --bg:#f6f1e9; --ink:#2b2118; --accent:#8a4b2a; --card:#fffaf3; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: Georgia, serif; background:var(--bg); color:var(--ink); }
  header { padding:40px 20px 24px; text-align:center; }
  h1 { margin:0; font-size:40px; letter-spacing:1px; }
  .tag { margin:8px 0 0; font-style:italic; color:var(--accent); }
  main { max-width:560px; margin:0 auto; padding:0 16px 40px; }
  h2 { font-size:20px; border-bottom:2px solid var(--accent); padding-bottom:6px; }
  .item { display:flex; justify-content:space-between; background:var(--card); padding:12px 14px; margin:8px 0; border-radius:10px; }
  .item small { display:block; color:#7a6a5a; font-size:13px; }
  .hours { background:var(--card); padding:14px; border-radius:10px; line-height:1.6; }
  footer { text-align:center; font-size:13px; color:#7a6a5a; padding:20px; }
</style>
</head>
<body>
<header>
  <h1>Barn Coffee</h1>
  <p class="tag">Small batch coffee in an old red barn.</p>
</header>
<main>
  <h2>Menu</h2>
  <div id="menu">Loading menu...</div>
  <h2>Hours</h2>
  <div class="hours">Mon to Fri: 7am to 3pm<br>Sat: 8am to 2pm<br>Sun: Closed</div>
</main>
<footer>12 Orchard Road</footer>
<script>
fetch('menu.json').then(r => r.json()).then(items => {
  document.getElementById('menu').innerHTML = items.map(i =>
    '<div class="item"><div>' + i.name + '<small>' + (i.note || '') + '</small></div><div>$' + i.price.toFixed(2) + '</div></div>'
  ).join('');
});
</script>
</body>
</html>
